name: Release App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          full_version="$(sed -n 's/^version:[[:space:]]*//p' simple_live_app/pubspec.yaml | tr -d '\r' | head -n 1)"
          if [ -z "$full_version" ]; then
            echo "::error::无法从 simple_live_app/pubspec.yaml 解析 version 字段"
            exit 1
          fi
          pubspec_version="${full_version%%+*}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            tag="$GITHUB_REF_NAME"
            if [ "$version" != "$pubspec_version" ]; then
              echo "::error::tag $tag 与 pubspec 版本 $pubspec_version 不一致，请先同步 version 字段"
              exit 1
            fi
          else
            version="$pubspec_version"
            tag="v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "pubspec 版本: $pubspec_version / 发布版本: $version / tag: $tag"

  test:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: simple_live_app/.fvmrc
          channel: stable
          cache: true

      - name: Normalize pub mirror
        working-directory: simple_live_app
        run: |
          if [ -f pubspec.lock ]; then
            perl -pi -e 's#https://pub\.flutter-io\.cn#https://pub.dev#g' pubspec.lock
          fi

      - name: Install dependencies
        working-directory: simple_live_app
        run: flutter pub get

      - name: Analyze
        working-directory: simple_live_app
        run: flutter analyze

  android:
    name: Android APK
    needs: [prepare, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: simple_live_app/.fvmrc
          channel: stable
          cache: true

      - name: Normalize pub mirror
        working-directory: simple_live_app
        run: |
          if [ -f pubspec.lock ]; then
            perl -pi -e 's#https://pub\.flutter-io\.cn#https://pub.dev#g' pubspec.lock
          fi

      - name: Install dependencies
        working-directory: simple_live_app
        run: flutter pub get

      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          : "${KEYSTORE_BASE64:?KEYSTORE_BASE64 未配置}"
          : "${STORE_PASSWORD:?STORE_PASSWORD 未配置}"
          : "${KEY_PASSWORD:?KEY_PASSWORD 未配置}"
          : "${KEY_ALIAS:?KEY_ALIAS 未配置}"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/simple-live-release.jks"
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$RUNNER_TEMP/simple-live-release.jks"
          } > simple_live_app/android/key.properties

      - name: Build release APKs
        working-directory: simple_live_app
        run: flutter build apk --release --split-per-abi

      - name: Collect artifacts
        shell: bash
        run: |
          version="${{ needs.prepare.outputs.version }}"
          mkdir -p dist
          cp simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            "dist/SimpleLive-$version-android-armeabi-v7a.apk"
          cp simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "dist/SimpleLive-$version-android-arm64-v8a.apk"
          cp simple_live_app/build/app/outputs/flutter-apk/app-x86_64-release.apk \
            "dist/SimpleLive-$version-android-x86_64.apk"
          ls -lh dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          retention-days: 3
          if-no-files-found: error

  apple:
    name: iOS and macOS
    needs: [prepare, test]
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: simple_live_app/.fvmrc
          channel: stable
          cache: true

      - name: Normalize pub mirror
        working-directory: simple_live_app
        run: |
          if [ -f pubspec.lock ]; then
            perl -pi -e 's#https://pub\.flutter-io\.cn#https://pub.dev#g' pubspec.lock
          fi

      - name: Install dependencies
        working-directory: simple_live_app
        run: flutter pub get

      - name: Build iOS
        working-directory: simple_live_app
        run: flutter build ios --release --no-codesign

      - name: Package iOS IPA
        shell: bash
        run: |
          version="${{ needs.prepare.outputs.version }}"
          mkdir -p dist
          cd simple_live_app
          mkdir -p build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/Runner.app
          cd build/ios/iphoneos
          zip -qry "$GITHUB_WORKSPACE/dist/SimpleLive-$version-ios-unsigned.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Build macOS
        working-directory: simple_live_app
        run: flutter build macos --release

      - name: Check macOS architectures
        shell: bash
        run: |
          lipo -archs "simple_live_app/build/macos/Build/Products/Release/Simple Live.app/Contents/MacOS/Simple Live"

      - name: Package macOS DMG and ZIP
        shell: bash
        run: |
          version="${{ needs.prepare.outputs.version }}"
          cd simple_live_app
          mkdir -p "$GITHUB_WORKSPACE/dist" dmg
          ditto "build/macos/Build/Products/Release/Simple Live.app" "dmg/Simple Live.app"
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Simple Live" -srcfolder dmg -ov -format UDZO \
            "$GITHUB_WORKSPACE/dist/SimpleLive-$version-macos.dmg"
          ditto -c -k --sequesterRsrc --keepParent \
            "build/macos/Build/Products/Release/Simple Live.app" \
            "$GITHUB_WORKSPACE/dist/SimpleLive-$version-macos.zip"
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Upload iOS and macOS
        uses: actions/upload-artifact@v4
        with:
          name: apple
          path: dist/*
          retention-days: 3
          if-no-files-found: error

  linux:
    name: Linux x64
    needs: [prepare, test]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: simple_live_app/.fvmrc
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libasound2-dev libmpv-dev mpv

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Normalize pub mirror
        working-directory: simple_live_app
        run: |
          if [ -f pubspec.lock ]; then
            perl -pi -e 's#https://pub\.flutter-io\.cn#https://pub.dev#g' pubspec.lock
          fi

      - name: Install dependencies
        working-directory: simple_live_app
        run: flutter pub get

      - name: Build Linux release
        working-directory: simple_live_app
        run: flutter build linux --release

      - name: Package tar.gz
        shell: bash
        run: |
          version="${{ needs.prepare.outputs.version }}"
          mkdir -p dist
          cd simple_live_app/build/linux/x64/release
          mv bundle "SimpleLive-$version"
          tar -czf "$GITHUB_WORKSPACE/dist/SimpleLive-$version-linux-x64.tar.gz" "SimpleLive-$version"
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          retention-days: 3
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: [prepare, test]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: simple_live_app/.fvmrc
          channel: stable
          cache: true

      - name: Normalize pub mirror
        working-directory: simple_live_app
        shell: pwsh
        run: |
          if (Test-Path pubspec.lock) {
            $lock = Get-Content pubspec.lock -Raw
            $lock.Replace('https://pub.flutter-io.cn', 'https://pub.dev') | Set-Content pubspec.lock -NoNewline
          }

      - name: Install dependencies
        working-directory: simple_live_app
        run: flutter pub get

      - name: Build Windows release
        working-directory: simple_live_app
        run: flutter build windows --release

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Compress-Archive -Path "simple_live_app/build/windows/x64/runner/Release/*" `
            -DestinationPath (Join-Path $dist "SimpleLive-$version-windows-x64.zip") `
            -CompressionLevel Optimal

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build setup EXE
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command iscc.exe -ErrorAction Stop).Source
          }
          & $iscc "/DMyAppVersion=$version" "/DDistDir=$dist" `
            "simple_live_app\windows\packaging\exe\setup.iss"

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          retention-days: 3
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [prepare, android, apple, linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR dist

      - name: Generate changelog
        shell: bash
        run: |
          tag="${{ needs.prepare.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            target="$tag"
          else
            target="HEAD"
          fi
          previous_tag="$(git describe --tags --abbrev=0 --match 'v*' "$target^" 2>/dev/null || true)"
          if [ -n "$previous_tag" ]; then
            range="$previous_tag..$target"
          else
            range="$target"
          fi
          changes="$(git log "$range" --no-merges --pretty=format:'- %s (%h)')"
          {
            echo "## 更新日志"
            echo
            if [ -n "$changes" ]; then
              printf '%s\n' "$changes"
            else
              echo "本次发布没有新的提交。"
            fi
          } > changelog.md
          echo "previous_tag=${previous_tag:-<none>} / range=$range"
          cat changelog.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Simple Live ${{ needs.prepare.outputs.version }}
          body_path: changelog.md
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          make_latest: true
          files: dist/*
          fail_on_unmatched_files: true
